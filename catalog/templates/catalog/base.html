<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Каталог{% endblock %} — Skystore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        .product-img { height: 200px; object-fit: cover; }
        .product-img-placeholder {
            height: 200px; display: flex; align-items: center; justify-content: center;
            background: #e9ecef; color: #6c757d;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">

{% include "catalog/includes/menu.html" %}

<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white-50 py-3 mt-auto">
    <div class="container d-flex justify-content-between">
        <span>© {% now "Y" %} Skystore</span>
        <span>Учебный проект на Django</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
